<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thank You | A.K Mishra, Palmist</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--night:#0a0e2e;--deep:#161b52;--gold:#f5c542;--gold2:#ffe29a;--saffron:#ff9d2e;--ink:#f6f0e0;--mut:#b9b6d6;--card:rgba(16,20,62,.78);--line:rgba(245,197,66,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.65 'Mukta',system-ui,sans-serif;background-color:var(--night);
background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9a8,transparent),radial-gradient(1px 1px at 150px 20px,#fff,transparent),radial-gradient(1px 1px at 60px 140px,#cfd6ff,transparent),radial-gradient(ellipse at 15% 0%,#2b2a7a 0,transparent 55%),radial-gradient(ellipse at 90% 40%,#4a1f5e 0,transparent 50%),linear-gradient(#0a0e2e,#12163f);
background-size:180px 180px,220px 220px,260px 260px,200px 200px,auto,auto,auto;background-attachment:fixed}
h1,h2,.hd{font-family:'Tiro Devanagari Hindi',Georgia,serif;font-weight:400;color:var(--gold2);margin:0}
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco svg{position:absolute}
.ring{width:min(130vw,820px);left:50%;top:-18%;margin-left:min(-65vw,-410px);opacity:.16;animation:spin 240s linear infinite}
.hand{width:min(70vw,340px);right:-6%;bottom:2%;opacity:.17}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:18px 16px 56px}
.lang{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 22px}
.lang p{margin:0;color:var(--mut);font-size:15px}
.lang div{display:flex;gap:12px}
.lang button{min-width:140px;padding:12px 22px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:700 19px 'Mukta',sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:linear-gradient(135deg,var(--gold),var(--saffron));color:#2a1700;border-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.banner{margin:0 auto 26px;max-width:440px;border-radius:18px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(245,197,66,.12),0 18px 50px rgba(0,0,0,.55),0 0 60px rgba(245,157,46,.25)}
.banner img{display:block;width:100%;height:auto}
.intro{text-align:center;margin-bottom:26px}
.intro h1{font-size:clamp(28px,6.5vw,40px);line-height:1.25}
.intro p{margin:12px auto 0;max-width:34em;color:var(--mut);font-size:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:22px;backdrop-filter:blur(6px)}
section h2{font-size:25px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font:400 clamp(30px,8vw,42px)/1.1 'Tiro Devanagari Hindi',serif;color:var(--gold)}
.stats span{font-size:14px;color:var(--mut);line-height:1.3;display:block;margin-top:4px}
.avgstars{margin:16px 0 8px;text-align:center;font-size:26px;letter-spacing:4px;color:rgba(255,255,255,.18)}
.avgstars i{font-style:normal}.avgstars i.on{color:var(--gold)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:34px 1fr 28px;gap:8px;align-items:center;font-size:14px;color:var(--mut)}
.bar div{height:9px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar div i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--saffron),var(--gold));transition:width .6s}
label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(8,10,36,.7);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.stars button{background:none;border:0;cursor:pointer;font-size:clamp(40px,12vw,56px);line-height:1;color:rgba(255,255,255,.22);padding:2px 4px;transition:transform .15s,color .15s;-webkit-tap-highlight-color:transparent}
.stars button.on{color:var(--gold);text-shadow:0 0 18px rgba(245,197,66,.7)}
.stars button:active{transform:scale(1.25)}
.rlabel{text-align:center;min-height:30px;font:400 22px 'Tiro Devanagari Hindi',serif;color:var(--gold2)}
.send{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;font:700 20px 'Mukta',sans-serif;color:#2a1700;background:linear-gradient(135deg,var(--gold),var(--saffron));cursor:pointer}
.send:disabled{opacity:.6}
.msg{margin:12px 0 0;text-align:center;min-height:24px;color:var(--gold2)}
.msg.err{color:#ffb4a2}
.rev{border-top:1px solid var(--line);padding:14px 0}
.rev:first-of-type{border-top:0}
.rev .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.rev strong{font-size:18px}.rev .st{color:var(--gold);letter-spacing:2px}.rev time{color:var(--mut);font-size:13px}
.rev p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--mut);text-align:center;margin:6px 0}
.soc{display:grid;gap:14px}
.soc div{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(255,255,255,.04)}
.soc p{margin:0 0 10px;color:var(--ink)}
.soc a{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;color:#fff}
.soc a b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);font-size:14px}
.fb{background:#1877f2}.yt{background:#e0201b}.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}
footer{text-align:center;font:400 26px 'Tiro Devanagari Hindi',serif;color:var(--gold2);margin-top:30px}
footer small{display:block;font:400 14px 'Mukta',sans-serif;color:var(--mut);margin-top:4px}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
@media(prefers-reduced-motion:reduce){.ring{animation:none}.bar div i{transition:none}}
</style>
</head>

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(x,y,n,v){if(reduce)return;const col=['#f5c542','#ff9d2e','#ff5d8f','#7ee0ff','#a78bfa','#ffffff'];
for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.6,s=4+Math.random()*(6+v*1.6);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:5+Math.random()*6,c:col[i%col.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,sh:Math.random()<.5,l:1})}
for(let i=0;i<Math.min(v,5);i++){const a=-Math.PI/2+(Math.random()-.5)*1.8,s=6+Math.random()*7;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,e:'🎉',s:26+Math.random()*10,r:0,vr:0,l:1})}
if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0&&p.y<cv.height+40);
for(const p of P){p.vy+=.24;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.006;cx.globalAlpha=Math.max(0,Math.min(1,p.l*1.6));
if(p.e){cx.font=p.s+'px serif';cx.fillText(p.e,p.x,p.y)}else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.sh)cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);else{cx.beginPath();cx.arc(0,0,p.s/2.4,0,7);cx.fill()}cx.restore()}}
cx.globalAlpha=1;if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
// data
function all(){return dbItems.concat(localItems)}
function render(){const a=all(),n=a.length,t=T[L];
$('sc').textContent=n;
const avg=n?a.reduce((s,x)=>s+x.stars,0)/n:0,min=n?Math.min(...a.map(x=>x.stars)):0;
$('sa').textContent=n?avg.toFixed(1):'—';$('sm').textContent=n?min:'—';
$('as').innerHTML=[1,2,3,4,5].map(i=>`<i class="${n&&i<=Math.round(avg)?'on':''}">★</i>`).join('');
$('bars').innerHTML=[5,4,3,2,1].map(k=>{const c=a.filter(x=>x.stars===k).length;return `<div class="bar"><span>${k} ★</span><div><i style="width:${n?c/n*100:0}%"></i></div><span>${c}</span></div>`}).join('');
const box=$('revs');box.textContent='';
if(!n){const p=document.createElement('p');p.className='empty';p.textContent=t.empty;box.appendChild(p)}
a.slice().sort((x,y)=>y.ts-x.ts).slice(0,40).forEach(x=>{const d=document.createElement('div');d.className='rev';
const top=document.createElement('div');top.className='top';
const nm=document.createElement('strong');nm.textContent=x.name||t.anon;
const st=document.createElement('span');st.className='st';st.textContent='★'.repeat(x.stars)+'☆'.repeat(5-x.stars);
const tm=document.createElement('time');tm.textContent=new Date(x.ts).toLocaleDateString(t.loc,{day:'numeric',month:'short',year:'numeric'});
top.append(nm,st,tm);d.appendChild(top);
if(x.text){const p=document.createElement('p');p.textContent=x.text;d.appendChild(p)}box.appendChild(d)})}
function social(){const t=T[L];$('soc').innerHTML=[['fb','Facebook','f',t.follow],['yt','YouTube','▶',t.sub],['ig','Instagram','◎',t.follow]].map(([k,n,ic,v])=>`<div><p>${t.socLine}</p><a class="${k}" href="${LINKS[k]}" target="_blank" rel="noopener noreferrer"><b>${ic}</b>${n} · ${v}</a></div>`).join('')}
function setLang(l){L=l;try{localStorage.setItem('akm_lang',l)}catch(e){}document.documentElement.lang=l;
$('bhi').setAttribute('aria-pressed',l==='hi');$('ben').setAttribute('aria-pressed',l==='en');
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
$('tx').placeholder=T[l].ph;paintStars();social();render()}
$('bhi').onclick=()=>setLang('hi');$('ben').onclick=()=>setLang('en');
$('f').addEventListener('submit',async e=>{e.preventDefault();const t=T[L],m=$('msg');
if(!R){m.className='msg err';m.textContent=t.needStar;return}
const rec={name:$('nm').value.trim().slice(0,60),stars:R,text:$('tx').value.trim().slice(0,600),ts:Date.now(),lang:L};
const sb=$('sb');sb.disabled=true;let saved=false;
try{if(DB){await DB.collection('feedback').add(rec);saved=true}}catch(err){}
if(!saved){localItems.push(rec);try{localStorage.setItem('akm_fb',JSON.stringify(localItems))}catch(err){}}
m.className='msg';m.textContent=saved?t.ok:t.local;
const r=sb.getBoundingClientRect();burst(r.left+r.width/2,r.top,70+R*10,R);
$('f').reset();R=0;paintStars();sb.disabled=false;render();setTimeout(()=>$('stats').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}),1100)});
async function init(){setLang(L);
try{if(window.claude&&claude.use){DB=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),10000))])}}catch(e){DB=null}
if(DB){try{DB.collection('feedback').onSnapshot(s=>{dbItems=s.docs.map(d=>d.data()).filter(x=>x&&x.stars>=1&&x.stars<=5);render()},()=>{DB=null})}catch(e){DB=null}}}
init();
</script>
</body>
</html>
